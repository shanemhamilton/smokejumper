name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all scripts
        run: |
          shellcheck -x \
            skills/smokejumper/scripts/sj \
            skills/smokejumper/scripts/sj-*.sh \
            skills/smokejumper/scripts/lib/*.sh

  bats:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y bats
      - name: Install bats (macos)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Run test suite
        run: bats tests/
      - name: Run test suite without jq (fallback paths)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f "$(command -v jq)" || true
          bats tests/
